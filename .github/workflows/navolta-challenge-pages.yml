name: NAVOLTA Challenge Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'navolta-projektleiter-challenge/**'
      - 'rapportstudio/**'
      - 'projektcockpit/**'
      - '.github/workflows/navolta-challenge-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: navolta-challenge-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site/navolta-projektleiter-challenge
          cp -R navolta-projektleiter-challenge/. _site/navolta-projektleiter-challenge/
          test -f _site/navolta-projektleiter-challenge/index.html
          mkdir -p _site/rapportstudio
          cp -R rapportstudio/. _site/rapportstudio/
          test -f _site/rapportstudio/index.html
          mkdir -p _site/projektcockpit
          cp -R projektcockpit/. _site/projektcockpit/
          test -f _site/projektcockpit/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
